name: Android Build CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.bump_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache Android SDK
        uses: actions/cache@v2
        with:
          path: ~/.android
          key: ${{ runner.os }}-sdk-${{ hashFiles('**/build.gradle') }}
          restore-keys: ${{ runner.os }}-sdk-

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 8

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Bump version
        id: bump_version
        run: |
          set -e
          git fetch --depth=1 origin +refs/tags/*:refs/tags/* || echo "No tags found"
          old_version="$(git describe --abbrev=0 --tags $(git rev-list --tags --max-count=1) || echo "0.0.0.0")"
          echo "Old version: ${old_version}"
          # Extract version components
          major=$(echo "${old_version}" | awk -F. '{print $1}')
          minor=$(echo "${old_version}" | awk -F. '{print $2}')
          patch=$(echo "${old_version}" | awk -F. '{print $3}')
          build=$(echo "${old_version}" | awk -F. '{print $4}')
          build=$((build + 1))
          # Construct new version string
          new_version="${major}.${minor}.${patch}.${build}"
          echo "New version: ${new_version}"
          echo "version=${new_version}" >> "$GITHUB_ENV"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          # Set placeholder keystore and properties for signing
          mkdir -p keys
          echo "dummy-keystore-content" > keys/dummy.keystore
          echo "{}" > google-services.json
          echo "majorVersion=1\nminorVersion=0\npatchVersion=0\nbuildNumber=1" > version.properties
          ./gradlew :app:assembleRelease --scan

      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: builds
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Build Reports
        uses: actions/upload-artifact@v3
        with:
          name: build-reports
          path: build/reports/

  release:
    name: Release APK
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v1
        with:
          name: builds

      - name: Print APK Version
        env:
          ver: ${{ needs.build.outputs.version }}
        run: |
          echo "Version: ${ver}"
          cd builds
          ls

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.version }}
          release_name: ${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          files: builds/*.apk
